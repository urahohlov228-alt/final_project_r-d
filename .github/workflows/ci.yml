name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts data evals

      - name: Tests (offline — no API keys needed)
        run: python -m pytest tests/ -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t hr-assistant:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --rm -p 8080:8080 --name smoke hr-assistant:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/metrics > /dev/null
          docker stop smoke
