services:
  hr-assistant:
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env (free key at console.groq.com)}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      ROUTER_MODEL: ${ROUTER_MODEL:-llama-3.1-8b-instant}
      APP_API_KEY: ${APP_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
